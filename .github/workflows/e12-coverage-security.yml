name: E12 - Seguridad y cobertura frontend

on:
  push:
    branches: [feature/e12-coverage-security-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm ci --prefix frontend
      - name: Compilar
        run: npm run build --prefix frontend
      - name: Ejecutar pruebas y medir cobertura
        run: npm run test:unit --prefix frontend
      - name: Confirmar reporte de cobertura
        run: test -s frontend/coverage/unit/lcov.info
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e12-frontend-coverage
          path: frontend/coverage/unit/
          if-no-files-found: warn
