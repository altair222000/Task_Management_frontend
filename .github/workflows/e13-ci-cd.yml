name: E13 CI/CD frontend

on:
  push:
    branches: [dev, release, main]
  pull_request:
    branches: [dev, release, main]

permissions:
  contents: read

jobs:
  pipeline:
    name: E13 frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm ci --prefix frontend

      - name: Compilar frontend
        run: npm run build --prefix frontend

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit --prefix frontend

      # Sonar verifica el quality gate en cada pull request y en main.
      - name: Analizar código y verificar quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        with:
          projectBaseDir: frontend
          args: >-
            -Dsonar.projectKey=altair222000_Task_Management_frontend
            -Dsonar.organization=altair222000
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.exclusions=node_modules/**,coverage/**,dist/**
            -Dsonar.javascript.lcov.reportPaths=coverage/unit/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
